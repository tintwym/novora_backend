spring.application.name=novora_backend

# Trust X-Forwarded-* behind reverse proxies so session cookies match the public host.
server.forward-headers-strategy=framework
# Secure cookies for HTTPS. Plain HTTP (local Vite / mobile) must set:
# SERVER_SERVLET_SESSION_COOKIE_SECURE=false  (or use Spring profile `local`).
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=1h
server.servlet.session.cookie.max-age=3600

# PostgreSQL — set DB_* in novora_backend/.env (see .env.example).
# Production: Neon (TLS required: …?sslmode=require). Hosted API: Render.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/novora_backend}
spring.datasource.username=${DB_USERNAME:${user.name}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.validation-timeout=10000

# Flyway runs before Hibernate. Prefer JPA_DDL_AUTO=validate|none on shared DBs.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=10
spring.flyway.locations=classpath:db/migration

# Liveness ignores DB so orchestrator healthchecks stay green while DB errors appear in logs.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Optional Firebase Bearer tokens. Default: cookie sessions (JSESSIONID) + CSRF.
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Exact CORS origins only (no wildcards with allowCredentials).
app.cors.additional-origin-patterns=${APP_CORS_ADDITIONAL_ORIGIN_PATTERNS:https://novora-hrms.vercel.app}

# Profile OTP (mail not wired — codes are logged). Never expose codes in production.
app.otp.ttl-seconds=${APP_OTP_TTL_SECONDS:600}
app.otp.resend-cooldown-seconds=${APP_OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.expose-code=${APP_OTP_EXPOSE_CODE:false}
