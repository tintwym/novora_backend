spring.application.name=novora_backend

# Plain HTTP on :8081 (matches Next.js dev proxy / mobile clients).
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=1h
server.servlet.session.cookie.max-age=3600
server.port=8081

# In-memory H2 for demos — ReferenceDataSeeder + BootstrapAdminConfiguration seed at runtime.
spring.datasource.url=jdbc:h2:mem:novora_backend_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Postgres Flyway scripts are not H2-compatible.
spring.flyway.enabled=false

# Allow OTP debug codes in local demo API responses.
app.otp.expose-code=true

logging.level.org.springframework.web=INFO
