name: Keep Render awake

on:
  schedule:
    # Render free instances sleep after ~15 min idle; GitHub may delay runs by a few minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping liveness
        run: |
          curl -fsS -m 180 --retry 2 --retry-delay 10 \
            https://novora-backend-wiem.onrender.com/actuator/health/liveness
